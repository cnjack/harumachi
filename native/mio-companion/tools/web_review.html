<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>澪 · Live2D 动作检查</title>
<style>
body{margin:0;background:#f7f6f0;color:#35434b;font:15px system-ui}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:#fff}button{font:inherit;padding:7px 14px;background:#fff;border:1px solid #cbd2d4;border-radius:7px;cursor:pointer}button:focus{outline:2px solid #5491a5}main{display:flex;justify-content:center}canvas{max-height:calc(100vh - 110px);max-width:100%;object-fit:contain}output{display:block;overflow-wrap:anywhere;padding:10px;text-align:center;font:12px monospace}body.dark{background:#191a2c;color:#c9d3df}#errors{color:#b52c21}
body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto}main{min-height:0;overflow:hidden}#stage canvas{height:100%;width:auto;max-height:100%;max-width:100%}output{font-size:10px;padding:4px}details{max-height:25vh;overflow:auto}pre{white-space:pre-wrap}</style>
<header><strong>澪</strong><button data-motion="Idle">放下</button><button data-motion="wave">招手</button><button data-motion="think">思考</button><button data-motion="talk">说话</button><button data-motion="encourage">加油</button><button data-look="-1">向左看</button><button data-look="0">看正面</button><button data-look="1">向右看</button><button data-look="auto">跟随视线</button><button id="background">切换底色</button><button data-mood="neutral">平静</button><button data-mood="warm">温柔</button><button data-mood="joyful">喜悦</button><button data-mood="curious">好奇</button><button data-mood="concerned">关心</button><button data-mood="surprised">惊讶</button><button data-mood="determined">坚定</button><button data-mood="sleepy">困倦</button><button id="scenario">情境流程</button><button id="review">检查切换</button><button id="emotions">表情与手形验收</button><button id="joints">关节切换验收</button><button id="standard">标准模型验收</button></header>
<main id="stage"></main><output id="status">加载模型…</output><output id="errors"></output><details><summary>逐帧验收记录</summary><pre id="validation"></pre></details>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://imduck42.github.io/Live2D-Viewer/libs/live2dcubismcore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script type="module">
import {MioPerformanceController} from "./mio-performance.js";
// Review harness only. Runtime libraries stay external; the model ZIP is
// renderer-independent and does not redistribute Live2D's proprietary Core.
(async()=>{
const status=document.querySelector('#status'),error=document.querySelector('#errors');
// Keep the rendered/accessible record compact. Tens of thousands of pretty
// printed sample lines can stall WebKit accessibility while inspecting results.
// Full samples remain downloadable for offline diagnostics.
function report(result){
 const {samples,...summary}=result;
 document.querySelector('#validation').textContent=JSON.stringify(summary,null,2);
 let link=document.querySelector('#download-review');
 if(!link){link=document.createElement('a');link.id='download-review';link.textContent='下载完整逐帧记录';document.querySelector('details').append(link);}
 if(link.href.startsWith('blob:'))URL.revokeObjectURL(link.href);
 link.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));link.download='mio-web-review.json';
}
window.addEventListener('error',e=>error.textContent=e.message);
window.addEventListener('unhandledrejection',e=>error.textContent=String(e.reason));
try {
 PIXI.live2d.config.sound=false;
 const app=new PIXI.Application({width:750,height:1000,backgroundAlpha:0,antialias:true,preserveDrawingBuffer:true});
 document.querySelector('#stage').append(app.view);
 const model=await PIXI.live2d.Live2DModel.from('Mio/Mio.model3.json',{autoInteract:true});
 app.stage.addChild(model);model.scale.set(Math.min(750/model.width,1000/model.height));model.x=(750-model.width)/2;model.y=(1000-model.height)/2;
 let controller=await MioPerformanceController.create(model);
 let lookPreset=null;
 model.internalModel.on('beforeMotionUpdate',()=>{if(lookPreset!==null)model.internalModel.focusController.focus(lookPreset,0,true);});
 document.querySelectorAll('[data-look]').forEach(button=>button.onclick=()=>{lookPreset=button.dataset.look==='auto'?null:Number(button.dataset.look);});
 let phases=new Set(),moods=new Set(),speechFrames=0,pauseFrames=0;
 let emotionCase=null,emotionSamples=[],emotionChecks=[],rendered={mouth:0,hand:0};
 let jointCase=null,jointSamples=[],previousCoreTime=null,previousJointCase=null,previousJointParameters={};const topology=await (await fetch('Mio.bindings.json')).json();
 function anchor(id,point){const l=topology.meshes.find(m=>m.id===id),p=model.internalModel.getDrawableVertices(id);const x=Math.max(0,Math.min(l.columns-.00001,(point[0]-l.rect[0])/l.rect[2]*l.columns)),y=Math.max(0,Math.min(l.rows-.00001,(point[1]-l.rect[1])/l.rect[3]*l.rows)),ix=Math.floor(x),iy=Math.floor(y),u=x-ix,v=y-iy,a=iy*(l.columns+1)+ix,b=a+1,c=a+l.columns+1,d=c+1;return [0,1].map(k=>u+v<=1?p[2*a+k]*(1-u-v)+p[2*b+k]*u+p[2*c+k]*v:p[2*b+k]*(1-v)+p[2*d+k]*(u+v-1)+p[2*c+k]*(1-u));}
 // beforeModelUpdate exposes current parameters but the previous Core mesh.
 // Pair that mesh with the previous update's timestamp, not the next ticker time.
 const recordFrame=()=>{const core=model.internalModel.coreModel;if(previousJointCase&&previousJointCase===jointCase)jointSamples.push({case:previousJointCase,t:previousCoreTime,wrist:anchor('forearm_right',[486,508]),parameters:previousJointParameters});previousCoreTime=performance.now()/1000;previousJointCase=jointCase;previousJointParameters=jointCase?Object.fromEntries(['ParamShoulderL','ParamShoulderR','ParamElbowL','ParamElbowR','ParamWristL','ParamWristR','ParamBodyAngleZ','ParamTorsoLift'].map(id=>[id,core.getParameterValueById(id)])):{};rendered={yaw:core.getParameterValueById('ParamAngleX'),roll:core.getParameterValueById('ParamAngleZ'),case:emotionCase,frame:frames,t:(performance.now()-started)/1000,mouth:core.getParameterValueById('ParamMouthOpenY'),thought:core.getParameterValueById('ParamThought'),eye:core.getParameterValueById('ParamEyeLOpen'),elbow:core.getParameterValueById('ParamElbowR'),shoulder:core.getParameterValueById('ParamShoulderR'),brow:core.getParameterValueById('ParamBrowLAngle'),smile:core.getParameterValueById('ParamEyeLSmile'),round:core.getParameterValueById('ParamMouthRound'),hand:core.getParameterValueById('ParamHandR'),spread:core.getParameterValueById('ParamFingerSpreadR'),hairL:core.getParameterValueById('ParamHairSideL'),hairR:core.getParameterValueById('ParamHairSideR')};if(emotionCase)emotionSamples.push(rendered);};model.internalModel.on('beforeModelUpdate',recordFrame);
 let frames=0,started=performance.now(),current='Idle',reviews=[],timer=null,handFadeFrames=0;
 model.internalModel.motionManager.on('motionStart',(group,index)=>{current=group;reviews.push({group,index,at:performance.now()-started});});
 app.ticker.add(()=>{frames++;phases.add(controller.state.intent);moods.add(controller.state.mood);if(controller.state.speaking){speechFrames++;if(controller.state.mouth===0)pauseFrames++;}const core=model.internalModel.coreModel;for(const id of ['ParamHandL','ParamHandR']){const value=core.getParameterValueById(id);if(Math.abs(value-Math.round(value))>0.0001)handFadeFrames++;}if(frames%30===0)status.textContent=JSON.stringify({loaded:true,frames,seconds:+((performance.now()-started)/1000).toFixed(1),motion:current,physics:!!model.internalModel.physics,parameters:model.internalModel.coreModel.getParameterCount(),actualMouth:rendered.mouth,actualHand:rendered.hand,lookPreset:lookPreset??'auto',yaw:rendered.yaw,roll:rendered.roll,standard:document.querySelector('#standard').dataset.state||'idle',joints:document.querySelector('#joints').dataset.state||'idle',emotionReview:document.querySelector('#emotions').dataset.state||'idle',motionsStarted:reviews.length,handFadeFrames,review:document.querySelector('#review').dataset.state||'idle',scenario:document.querySelector('#scenario').dataset.state||'idle',performance:controller.state,phases:[...phases],moods:[...moods],speechFrames,pauseFrames});});
 document.querySelectorAll('[data-motion]').forEach(button=>button.onclick=()=>controller.manual(button.dataset.motion));
 document.querySelectorAll('[data-mood]').forEach(button=>button.onclick=()=>controller.setMood(button.dataset.mood));
 document.querySelector('#scenario').onclick=()=>{
   if(document.querySelector('#scenario').dataset.state==='running')return;
   document.querySelector('#scenario').dataset.state='running';
   const events=[[0,{intent:'welcome',mood:'happy',text:'欢迎回来。今天也一起慢慢来吧。'}],[7000,{intent:'quiet',mood:'neutral'}],[13000,{intent:'waiting',mood:'thinking'}],[17000,{intent:'reply',mood:'concerned',text:'我在听，先别着急。我们可以一件一件慢慢来。'}],[25000,{intent:'quiet',mood:'neutral'}]];
   events.forEach(([delay,event])=>setTimeout(()=>controller.event(event),delay));
   setTimeout(()=>document.querySelector('#scenario').dataset.state='complete',28000);
 };
 document.querySelector('#emotions').onclick=async()=>{
   const button=document.querySelector('#emotions');if(button.dataset.state==='running')return;button.dataset.state='running';emotionSamples=[];emotionChecks=[];
   const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
   const cases=[['neutral','rest'],['warm','explain'],['joyful','wave'],['curious','chin'],['concerned','rest'],['surprised','rest'],['determined','encourage'],['sleepy','rest']];
   for(const [style,hand] of cases){emotionCase=style;controller.event({intent:'reply',mood:'neutral',text:'我在听，我们一起慢慢来。',expression:{style,intensity:'strong',hand}});await wait(4200);}
   emotionCase='quiet';controller.event({intent:'quiet',expression:{style:'warm',intensity:'normal',hand:'wave'}});await wait(1500);
   emotionCase='manual-talk';controller.setMood('neutral');controller.manual('talk');await wait(4500);emotionCase=null;
   const samples=name=>emotionSamples.filter(x=>x.case===name),range=(name,key)=>Math.max(...samples(name).map(x=>x[key]));
   emotionChecks=[['38 parameters',model.internalModel.coreModel.getParameterCount()===38],['speech opens',range('warm','mouth')>.25],['manual talk opens',range('manual-talk','mouth')>.25],['quiet closes',range('quiet','mouth')<.001],['smile-eye geometry driven',range('joyful','smile')>.65],['concerned brow',range('concerned','brow')>.65],['round mouth',range('surprised','round')>.8],['palm visible',samples('warm').some(x=>x.hand===1)],['chin visible',samples('curious').some(x=>x.hand===5)],['thinking cloud appears',range('curious','thought')>.25],['fist visible',samples('determined').some(x=>x.hand===4)],['integer hands',emotionSamples.every(x=>Math.abs(x.hand-Math.round(x.hand))<.0001)],['no runtime errors',!error.textContent]];
   const ok=emotionChecks.every(x=>x[1]);button.dataset.state=ok?'passed':'failed';report({checks:emotionChecks,frames:emotionSamples.length,samples:emotionSamples});
 };
 document.querySelector('#standard').onclick=async()=>{
   const button=document.querySelector('#standard');if(button.dataset.state==='running')return;button.dataset.state='running';
   controller.destroy();emotionSamples=[];const before=reviews.length,wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
   for(const group of ['Idle','wave','think','talk','encourage']){emotionCase='standard-motion-'+group;await model.expression('neutral');await model.motion(group,0,3);await wait(5600);}
   await model.motion('Idle',0,3);
   for(const name of ['neutral','warm','joyful','curious','concerned','surprised','determined','sleepy']){emotionCase='standard-expression-'+name;await model.expression(name);await wait(1800);}
   emotionCase=null;const peak=(name,key)=>Math.max(...emotionSamples.filter(x=>x.case===name).map(x=>x[key]));
   const checks=[['standalone 38 parameters',model.internalModel.coreModel.getParameterCount()===38],['standalone smile',peak('standard-expression-joyful','smile')>.7],['standalone brows',peak('standard-expression-concerned','brow')>.7],['standalone round mouth',peak('standard-expression-surprised','round')>.85],['standalone surprised aperture',peak('standard-expression-surprised','mouth')>.5],['side hair moves',emotionSamples.some(x=>Math.abs(x.hairL)+Math.abs(x.hairR)>.001)],['side hair phases differ',emotionSamples.some(x=>Math.abs(x.hairL-x.hairR)>.0001)],['standard hand steps',emotionSamples.every(x=>Math.abs(x.hand-Math.round(x.hand))<.0001)],['all five standard motions', ['Idle','wave','think','talk','encourage'].every(name=>reviews.slice(before).some(x=>x.group===name))],['no runtime errors',!error.textContent]];
   button.dataset.state=checks.every(x=>x[1])?'passed':'failed';report({helperActiveDuringTest:false,checks,frames:emotionSamples.length,samples:emotionSamples});
   controller=await MioPerformanceController.create(model);model.internalModel.off('beforeModelUpdate',recordFrame);model.internalModel.on('beforeModelUpdate',recordFrame);controller.manual('Idle');
 };
 document.querySelector('#joints').onclick=async()=>{
   const button=document.querySelector('#joints');if(button.dataset.state==='running')return;button.dataset.state='running';jointSamples=[];controller.setMood('neutral');
   const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),groups=['Idle','wave','think','talk','encourage'];
   for(const from of groups)for(const to of groups){jointCase=null;controller.manual(from);await wait(1800);jointCase=from+'→'+to;controller.manual(to);await wait(3600);}
   jointCase=null;let worst={speed:0},validIntervals=0;const counts={};
   for(const sample of jointSamples)counts[sample.case]=(counts[sample.case]||0)+1;
   for(let i=1;i<jointSamples.length;i++){const a=jointSamples[i-1],b=jointSamples[i],dt=b.t-a.t;if(a.case!==b.case||dt<.005||dt>.1)continue;validIntervals++;const speed=Math.hypot(b.wrist[0]-a.wrist[0],b.wrist[1]-a.wrist[1])/dt;if(speed>worst.speed)worst={speed,case:b.case,frame:i,dt};}
   const checks=[['all 25 transitions sampled',Object.keys(counts).length===25&&Object.values(counts).every(n=>n>=30)],['enough timed Core intervals',validIntervals>=500],['finite actual mesh coordinates',jointSamples.every(s=>Number.isFinite(s.t)&&s.wrist.every(Number.isFinite))],['moving hand measured',worst.speed>10],['bounded hand speed',worst.speed<=900],['no runtime errors',!error.textContent]];
   button.dataset.state=checks.every(x=>x[1])?'passed':'failed';report({groups:Object.keys(counts).length,frames:jointSamples.length,checks,groupFrames:counts,validIntervals,maximumHandSpeed:worst,threshold:900,measurement:"Core mesh paired with its own update timestamp",peakSamples:jointSamples.slice(Math.max(0,worst.frame-1),worst.frame+1),samples:jointSamples});
 };
 document.querySelector('#background').onclick=()=>document.body.classList.toggle('dark');
 document.querySelector('#review').onclick=()=>{
   if(timer)return;
   const sequence=['Idle','wave','think','encourage','talk','wave','Idle','think','Idle'];let i=0;
   const tick=()=>{if(i===sequence.length){clearInterval(timer);timer=null;document.querySelector('#review').dataset.state='complete';return;}
     document.querySelector('#review').dataset.state=`${i+1}/${sequence.length}`;controller.manual(sequence[i++]);};
   tick();timer=setInterval(tick,3600);
 };
}catch(e){error.textContent=String(e);status.textContent='加载失败';}
})();
</script></html>
